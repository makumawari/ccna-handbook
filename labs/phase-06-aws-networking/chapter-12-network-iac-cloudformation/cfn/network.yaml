AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lab 06/12 - mang co ban cho shopnet (VPC, subnet, IGW, route table, SG, NAT tuy chon).
  NAT mac dinh TAT vi tinh phi theo gio va theo GB. Du lieu gia, chi dung de hoc.

Parameters:
  Env:
    Type: String
    Default: stg
    AllowedValues: [stg, prd]
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR cua VPC (RFC 1918). Dung CIDR khac nhau cho moi moi truong.
  EnableNat:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: "true = tao 2 NAT gateway (TINH PHI THEO GIO + GB). Chi bat khi da kiem tra gia."

Conditions:
  CreateNat: !Equals [!Ref EnableNat, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "shopnet-${Env}" }
        - { Key: Project, Value: net-handbook }
        - { Key: Env, Value: !Ref Env }

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Project, Value: net-handbook }
        - { Key: Env, Value: !Ref Env }

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 16, 8]]
      Tags:
        - { Key: Name, Value: !Sub "shopnet-${Env}-public-a" }
        - { Key: Project, Value: net-handbook }

  PublicSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 16, 8]]
      Tags:
        - { Key: Name, Value: !Sub "shopnet-${Env}-public-c" }
        - { Key: Project, Value: net-handbook }

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [10, !Cidr [!Ref VpcCidr, 16, 8]]
      Tags:
        - { Key: Name, Value: !Sub "shopnet-${Env}-app-a" }
        - { Key: Project, Value: net-handbook }

  AppSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [11, !Cidr [!Ref VpcCidr, 16, 8]]
      Tags:
        - { Key: Name, Value: !Sub "shopnet-${Env}-app-c" }
        - { Key: Project, Value: net-handbook }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "shopnet-${Env}-rt-public" }
        - { Key: Project, Value: net-handbook }

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  PublicAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicAssocC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetC
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "shopnet-${Env}-rt-private-a" }
        - { Key: Project, Value: net-handbook }

  PrivateRouteTableC:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "shopnet-${Env}-rt-private-c" }
        - { Key: Project, Value: net-handbook }

  PrivateAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateAssocC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetC
      RouteTableId: !Ref PrivateRouteTableC

  # --- NAT (tinh phi) - chi tao khi EnableNat=true ---
  EipA:
    Type: AWS::EC2::EIP
    Condition: CreateNat
    DependsOn: IgwAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Project, Value: net-handbook }

  EipC:
    Type: AWS::EC2::EIP
    Condition: CreateNat
    DependsOn: IgwAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Project, Value: net-handbook }

  NatA:
    Type: AWS::EC2::NatGateway
    Condition: CreateNat
    Properties:
      SubnetId: !Ref PublicSubnetA
      AllocationId: !GetAtt EipA.AllocationId
      Tags:
        - { Key: Project, Value: net-handbook }

  NatC:
    Type: AWS::EC2::NatGateway
    Condition: CreateNat
    Properties:
      SubnetId: !Ref PublicSubnetC
      AllocationId: !GetAtt EipC.AllocationId
      Tags:
        - { Key: Project, Value: net-handbook }

  PrivateRouteA:
    Type: AWS::EC2::Route
    Condition: CreateNat
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatA

  PrivateRouteC:
    Type: AWS::EC2::Route
    Condition: CreateNat
    Properties:
      RouteTableId: !Ref PrivateRouteTableC
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatC

  # --- Security group: quy tac tach thanh resource rieng de tranh vong phu thuoc ---
  SgAlb:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB shopnet (lab)
      VpcId: !Ref Vpc
      Tags:
        - { Key: Project, Value: net-handbook }

  SgApp:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App shopnet (lab)
      VpcId: !Ref Vpc
      Tags:
        - { Key: Project, Value: net-handbook }

  SgAlbIngressHttps:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SgAlb
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: HTTPS tu client

  SgAppIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SgApp
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref SgAlb
      Description: Chi nhan tu SG cua ALB

Outputs:
  VpcId:
    Value: !Ref Vpc
  AppSubnets:
    Value: !Join [",", [!Ref AppSubnetA, !Ref AppSubnetC]]
  NatEnabled:
    Value: !Ref EnableNat
